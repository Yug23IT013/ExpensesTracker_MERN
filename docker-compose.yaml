services:
  frontend:
    build: ./client
    container_name: frontend
    ports:
      - 3000:3000
    depends_on:
      - backend

  backend:
    build: ./server
    container_name: express-backend
    ports:
      - 5000:5000
    environment:
      - "MONGO_URL: mongodb://mongo:27017/"
    depends_on:
      - mongo
  
  mongo:
    image: mongo:latest
    container_name: mongodb
    ports:
      - 27017:27017
