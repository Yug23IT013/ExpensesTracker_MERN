services:
  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    container_name: express-backend
    ports:
      - "5000:5000"
    enviroment:
      - MONGO_URL: "mongodb://localhost:27017/"
    depends_on:
      - mongo
  
  mongo:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
